<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Materials — CS Professor Teaching Tools</title>
    <meta name="description" content="Generate AI prompts for creating lecture notes, assignments, exams, and more.">
    <script src="https://cdn.tailwindcss.com/3.4.16" integrity="sha384-mS5Uq7sE90lgbBDN8xgf34ibEgbZo4gB3tfLY40ZRle+M188BQw8onzNHg6GUZaA" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        * { scroll-behavior: smooth; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #067e74 0%, #0d534d 100%); }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">

    <!-- Navigation -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-2.5 group">
                    <div class="w-9 h-9 gradient-bg rounded-lg flex items-center justify-center shadow-sm">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342"/></svg>
                    </div>
                    <span class="font-bold text-lg text-slate-800 group-hover:text-teal-700 transition-colors hidden sm:inline">CS Teaching Tools</span>
                </a>
                <div class="flex items-center gap-1 sm:gap-2">
                    <a href="check-work.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-teal-700 hover:bg-teal-50 transition-all">Check Work</a>
                    <a href="create-materials.html" class="px-3 py-2 rounded-lg text-sm font-medium text-teal-700 bg-teal-50 transition-all">Materials</a>
                    <a href="write-emails.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-teal-700 hover:bg-teal-50 transition-all">Emails</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="gradient-bg text-white">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-14">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-teal-200 hover:text-white text-sm font-medium mb-4 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
                Back to Home
            </a>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight fade-in">Create Materials</h1>
            <p class="mt-3 text-teal-100 text-lg max-w-2xl fade-in" style="animation-delay:0.1s">Generate a structured AI prompt to create high-quality course materials tailored to your needs.</p>
        </div>
    </header>

    <!-- Main Form -->
    <main class="flex-1">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <form id="materialsForm" class="bg-white rounded-2xl shadow-md border border-slate-200 p-6 sm:p-8 space-y-6 fade-in" style="animation-delay:0.15s" onsubmit="return false;">

                <!-- Row: Material Type + Target Level -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label for="materialType" class="block text-sm font-semibold text-slate-700 mb-1.5">Material Type <span class="text-red-500">*</span></label>
                        <select id="materialType" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-shadow">
                            <option value="">Select type…</option>
                            <option value="Lecture Notes">Lecture Notes</option>
                            <option value="Assignment">Assignment</option>
                            <option value="Exam/Quiz">Exam / Quiz</option>
                            <option value="Class Activity">Class Activity</option>
                            <option value="Study Guide">Study Guide</option>
                        </select>
                    </div>
                    <div>
                        <label for="targetLevel" class="block text-sm font-semibold text-slate-700 mb-1.5">Target Level <span class="text-red-500">*</span></label>
                        <select id="targetLevel" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-shadow">
                            <option value="">Select level…</option>
                            <option value="Freshman">Freshman</option>
                            <option value="Sophomore">Sophomore</option>
                            <option value="Junior">Junior</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>
                </div>

                <!-- Row: Course Name/Section + Topic -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label for="courseName" class="block text-sm font-semibold text-slate-700 mb-1.5">Course Name &amp; Section <span class="text-red-500">*</span></label>
                        <input type="text" id="courseName" required placeholder="e.g., CS 201 — Section A" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-shadow">
                    </div>
                    <div>
                        <label for="topicTitle" class="block text-sm font-semibold text-slate-700 mb-1.5">Topic / Title <span class="text-red-500">*</span></label>
                        <input type="text" id="topicTitle" required placeholder="e.g., Introduction to Recursion" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-shadow">
                    </div>
                </div>

                <!-- Learning Objectives -->
                <div>
                    <label for="learningObjectives" class="block text-sm font-semibold text-slate-700 mb-1.5">Learning Objectives <span class="text-red-500">*</span></label>
                    <textarea id="learningObjectives" required rows="4" placeholder="List the key learning objectives for this material (one per line or comma-separated)…" class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm leading-relaxed focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-shadow resize-y"></textarea>
                </div>

                <!-- Additional Notes -->
                <div>
                    <label for="additionalNotes" class="block text-sm font-semibold text-slate-700 mb-1.5">Additional Notes / Requirements <span class="text-slate-400 font-normal">(optional)</span></label>
                    <textarea id="additionalNotes" rows="4" placeholder="Any specific requirements, formatting preferences, example problems to include, difficulty constraints, etc." class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm leading-relaxed focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-shadow resize-y"></textarea>
                </div>

                <!-- Generate Button -->
                <div class="flex justify-end pt-2">
                    <button type="button" onclick="generatePrompt()" class="inline-flex items-center gap-2 gradient-bg text-white font-semibold px-6 py-3 rounded-xl shadow-md hover:shadow-lg hover:brightness-110 active:scale-[0.98] transition-all text-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z"/></svg>
                        Generate Materials Prompt
                    </button>
                </div>
            </form>

            <!-- Output Section -->
            <div id="outputSection" class="hidden mt-8 fade-in">
                <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-6 sm:p-8">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold text-slate-800">Generated Materials Prompt</h2>
                        <button type="button" onclick="copyToClipboard()" id="copyBtn" class="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm px-4 py-2 rounded-lg transition-colors">
                            <svg id="copyIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9.75a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184"/></svg>
                            <span id="copyText">Copy to Clipboard</span>
                        </button>
                    </div>
                    <textarea id="outputPrompt" readonly rows="18" class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm font-mono leading-relaxed text-slate-700 resize-y focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"></textarea>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-8">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-sm text-slate-500">&copy; 2026 CS Professor Teaching Tools. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function generatePrompt() {
            const materialType = document.getElementById('materialType').value;
            const targetLevel = document.getElementById('targetLevel').value;
            const courseName = document.getElementById('courseName').value.trim();
            const topicTitle = document.getElementById('topicTitle').value.trim();
            const learningObjectives = document.getElementById('learningObjectives').value.trim();
            const additionalNotes = document.getElementById('additionalNotes').value.trim();

            if (!materialType || !targetLevel || !courseName || !topicTitle || !learningObjectives) {
                alert('Please fill in all required fields.');
                return;
            }

            const notesSection = additionalNotes
                ? `\nAdditional Requirements:\n${additionalNotes}\n`
                : '';

            const prompt = `Please create the following course material:

Material Type: ${materialType}
Course: ${courseName}
Topic: ${topicTitle}
Target Audience: ${targetLevel}-level students

Learning Objectives:
${learningObjectives}
${notesSection}
Please provide:
- A well-structured and comprehensive ${materialType.toLowerCase()}
- Clear explanations appropriate for ${targetLevel}-level students
- Examples and practice problems where applicable
- Proper formatting with headings, bullet points, and code blocks if relevant
- An answer key or grading rubric if applicable`;

            document.getElementById('outputPrompt').value = prompt;
            const outputSection = document.getElementById('outputSection');
            outputSection.classList.remove('hidden');
            outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function copyToClipboard() {
            const output = document.getElementById('outputPrompt');
            navigator.clipboard.writeText(output.value).then(() => {
                const btn = document.getElementById('copyBtn');
                const textEl = document.getElementById('copyText');
                const iconEl = document.getElementById('copyIcon');
                textEl.textContent = 'Copied!';
                btn.classList.add('!bg-green-100', '!text-green-700');
                iconEl.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>';
                setTimeout(() => {
                    textEl.textContent = 'Copy to Clipboard';
                    btn.classList.remove('!bg-green-100', '!text-green-700');
                    iconEl.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9.75a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184"/>';
                }, 2000);
            });
        }
    </script>
</body>
</html>
