<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Materials — CS Teaching Tools</title>
    <script src="https://cdn.tailwindcss.com/3.4.16" integrity="sha384-mS5Uq7sE90lgbBDN8xgf34ibEgbZo4gB3tfLY40ZRle+M188BQw8onzNHg6GUZaA" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }

        /* SVG root-cause fix: prevent unconstrained SVGs from blowing up layout */
        svg { max-width: 100%; height: auto; }

        .icon-nav { width: 32px; height: 32px; flex-shrink: 0; }
        .icon-nav svg { width: 18px; height: 18px; }
        .icon-arrow { width: 14px; height: 14px; flex-shrink: 0; }
        .icon-btn { width: 16px; height: 16px; flex-shrink: 0; }
        .icon-copy { width: 14px; height: 14px; flex-shrink: 0; }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .field-error { border-color: #ef4444 !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-50 text-gray-800">

    <!-- Nav -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-14">
                <a href="index.html" class="flex items-center gap-2">
                    <div class="icon-nav bg-gradient-to-br from-purple-600 to-purple-700 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342"/></svg>
                    </div>
                    <span class="font-bold text-base text-gray-800 hidden sm:inline">CS Teaching Tools</span>
                </a>
                <div class="flex items-center gap-1">
                    <a href="check-work.html" class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-blue-600 hover:bg-blue-50 transition-colors">Check Work</a>
                    <a href="create-materials.html" class="px-3 py-1.5 rounded-md text-sm font-medium text-teal-600 bg-teal-50 transition-colors">Materials</a>
                    <a href="write-emails.html" class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-blue-600 hover:bg-blue-50 transition-colors">Emails</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-gradient-to-r from-teal-600 to-teal-700 text-white">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
            <a href="index.html" class="inline-flex items-center gap-1 text-teal-200 hover:text-white text-xs font-medium mb-2 transition-colors">
                <svg class="icon-arrow w-3.5 h-3.5 flex-shrink-0" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
                Home
            </a>
            <h1 class="text-xl sm:text-2xl font-bold fade-in">Create Materials</h1>
            <p class="mt-1 text-teal-100 text-sm fade-in" style="animation-delay:0.05s">Generate a structured prompt to create course materials tailored to your needs.</p>
        </div>
    </header>

    <!-- Form -->
    <main class="flex-1">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6">
            <form id="materialsForm" class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 space-y-4 fade-in" style="animation-delay:0.1s" onsubmit="return false;">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="materialType" class="block text-sm font-medium text-gray-700 mb-1">Material Type <span class="text-red-400">*</span></label>
                        <select id="materialType" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none">
                            <option value="">Select type...</option>
                            <option>Lecture Notes</option>
                            <option>Assignment</option>
                            <option>Exam / Quiz</option>
                            <option>Class Activity</option>
                            <option>Study Guide</option>
                        </select>
                    </div>
                    <div>
                        <label for="targetLevel" class="block text-sm font-medium text-gray-700 mb-1">Target Level <span class="text-red-400">*</span></label>
                        <select id="targetLevel" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none">
                            <option value="">Select level...</option>
                            <option>Freshman</option>
                            <option>Sophomore</option>
                            <option>Junior</option>
                            <option>Senior</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="courseName" class="block text-sm font-medium text-gray-700 mb-1">Course &amp; Section <span class="text-red-400">*</span></label>
                        <input type="text" id="courseName" required placeholder="e.g., CS 201 — Section A" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none">
                    </div>
                    <div>
                        <label for="topicTitle" class="block text-sm font-medium text-gray-700 mb-1">Topic / Title <span class="text-red-400">*</span></label>
                        <input type="text" id="topicTitle" required placeholder="e.g., Intro to Recursion" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none">
                    </div>
                </div>

                <div>
                    <label for="learningObjectives" class="block text-sm font-medium text-gray-700 mb-1">Learning Objectives <span class="text-red-400">*</span></label>
                    <textarea id="learningObjectives" required rows="3" placeholder="List the key learning objectives..." class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm leading-relaxed focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none resize-y"></textarea>
                </div>

                <div>
                    <label for="additionalNotes" class="block text-sm font-medium text-gray-700 mb-1">Additional Notes <span class="text-gray-400 font-normal">(optional)</span></label>
                    <textarea id="additionalNotes" rows="3" placeholder="Any extra requirements, formatting preferences, or example problems..." class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm leading-relaxed focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none resize-y"></textarea>
                </div>

                <div class="flex justify-end pt-1">
                    <button type="button" id="generateBtn" onclick="generatePrompt()" class="inline-flex items-center gap-2 bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-medium px-5 py-2.5 rounded-lg shadow-sm transition-colors text-sm cursor-pointer">
                        <svg class="icon-btn w-4 h-4 flex-shrink-0" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
                        Generate Materials Prompt
                    </button>
                </div>
            </form>

            <!-- Output -->
            <div id="outputSection" class="hidden mt-6 fade-in">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-sm font-semibold text-gray-800">Generated Prompt</h2>
                        <button type="button" id="copyBtn" onclick="copyToClipboard()" class="inline-flex items-center gap-1.5 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 font-medium text-xs px-3 py-1.5 rounded-md transition-colors cursor-pointer">
                            <svg id="copyIcon" class="icon-copy w-3.5 h-3.5 flex-shrink-0" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9.75a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184"/></svg>
                            <span id="copyText">Copy</span>
                        </button>
                    </div>
                    <textarea id="outputPrompt" readonly rows="14" class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm font-mono leading-relaxed text-gray-700 resize-y focus:ring-1 focus:ring-teal-400 outline-none"></textarea>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-5">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 text-center">
            <p class="text-xs text-gray-400">&copy; 2026 CS Professor Teaching Tools</p>
        </div>
    </footer>

    <script>
        function generatePrompt() {
            const fields = {
                materialType: document.getElementById('materialType'),
                targetLevel: document.getElementById('targetLevel'),
                courseName: document.getElementById('courseName'),
                topicTitle: document.getElementById('topicTitle'),
                learningObjectives: document.getElementById('learningObjectives')
            };

            document.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));

            let hasError = false;
            for (const [key, el] of Object.entries(fields)) {
                if (!el.value.trim()) {
                    el.classList.add('field-error');
                    hasError = true;
                }
            }
            if (hasError) return;

            const additionalNotes = document.getElementById('additionalNotes').value.trim();
            const notesSection = additionalNotes ? `\nAdditional Requirements:\n${additionalNotes}\n` : '';

            const prompt = `Please create the following course material:

Material Type: ${fields.materialType.value}
Course: ${fields.courseName.value.trim()}
Topic: ${fields.topicTitle.value.trim()}
Target Audience: ${fields.targetLevel.value}-level students

Learning Objectives:
${fields.learningObjectives.value.trim()}
${notesSection}
Please provide:
- A well-structured and comprehensive ${fields.materialType.value.toLowerCase()}
- Clear explanations appropriate for ${fields.targetLevel.value}-level students
- Examples and practice problems where applicable
- Proper formatting with headings, bullet points, and code blocks if relevant
- An answer key or grading rubric if applicable`;

            document.getElementById('outputPrompt').value = prompt;
            const section = document.getElementById('outputSection');
            section.classList.remove('hidden');
            section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function copyToClipboard() {
            const text = document.getElementById('outputPrompt').value;
            const btn = document.getElementById('copyBtn');
            const textEl = document.getElementById('copyText');

            navigator.clipboard.writeText(text).then(() => {
                textEl.textContent = 'Copied!';
                btn.classList.add('bg-green-100', 'text-green-700');
                btn.classList.remove('bg-gray-100', 'text-gray-600');
                setTimeout(() => {
                    textEl.textContent = 'Copy';
                    btn.classList.remove('bg-green-100', 'text-green-700');
                    btn.classList.add('bg-gray-100', 'text-gray-600');
                }, 2000);
            }).catch(() => {
                const ta = document.getElementById('outputPrompt');
                ta.select();
                document.execCommand('copy');
                textEl.textContent = 'Copied!';
                setTimeout(() => { textEl.textContent = 'Copy'; }, 2000);
            });
        }

        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.addEventListener('input', () => el.classList.remove('field-error'));
        });
    </script>
</body>
</html>
